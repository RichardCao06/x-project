[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lca-autonomy-system"
version = "0.2.0"
description = "Goal-governed self-evolving production system for LCA knowledge and data / 面向 LCA 知识与数据的目标契约治理自进化生产系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["lca", "autonomous-agents", "goal-contract", "governance", "self-evolving-systems"]

[project.optional-dependencies]
dev = ["pytest>=8", "Markdown>=3.4"]
docs = ["Markdown>=3.4"]

[project.scripts]
lca-platform = "lca_project.cli:main"
lca-governance = "lca_project.governance_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lca_project.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
