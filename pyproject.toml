[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lca-project"
version = "0.1.0"
description = "Autonomous, evidence-gated production platform for LCA skeleton databases"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "Markdown>=3.4"]
docs = ["Markdown>=3.4"]

[project.scripts]
lca-platform = "lca_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lca_project.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
