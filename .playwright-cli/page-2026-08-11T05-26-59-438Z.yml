    - heading "分类与适用范围" [level=3] [ref=e925]
    - paragraph [ref=e926]:
      - text: 刀片服务器属于服务器产品，其运行依赖刀片机箱提供的共享资源。
      - superscript [ref=e927]:
        - link "来源" [ref=e928] [cursor=pointer]:
          - /url: "#source-ku-bce26914c5b903dc"
      - superscript [ref=e929]:
        - link "来源" [ref=e930] [cursor=pointer]:
          - /url: "#source-ku-320f0db92754b3c0"
      - text: 本节点适用于表达刀片服务器制造端的产品层级建模。 适用对象应是以CPU执行通用计算任务为主要产品定位、按刀片服务器形态完成装配并通过相应机箱接口运行的成品。 归类记录应保存主要计算部件类型、交付形态、共享机箱依赖和成品SKU，任何一项缺失都应降低分类确定性而非用名称强行归类。
    - paragraph [ref=e931]: P003不能被包含刀片机箱、机架或数据中心设施的组合系统替代。 被排除的刀片机箱、机架等物理基础设施进入各自产品节点，其物理质量不计入P003，但通过产品或物料接口保留关联。 这些基础设施提供的供电、冷却或管理负荷进入相应服务接口，在使用阶段分配给P003，不能作为刀片服务器固有物料。
    - paragraph [ref=e932]: 排除判定先区分组件与成品：未达到完整装配和成品检验状态的对象转入相应部件节点；只有完整成品才进入服务器产品形态与主要功能的联合判定。 完整成品只有同时满足刀片式交付形态和以CPU通用计算为主的产品定位才能归入P003；两个正向准入项任一不满足即予排除，例如机架式交付或加速器主导的成品应转入与其全部身份刻面相符的服务器节点。
    - paragraph [ref=e933]: 混合功能产品先依据交付定义确认产品类别，再判断主要计算功能；物理质量贡献只解释配置差异，不单独决定分类。 交付定义与主要功能证据冲突时，应把对象列为待分类并补充交付文件、配置清单和功能证据，不能先建立配置类别。 证据补齐前，相似外形只可支持候选筛选，不能替代产品身份、成品层级与BOM边界判定。
    - paragraph [ref=e934]: 处理器代次、系统内存容量、存储数量、网络接口速率或管理模块版本的改变，通常作为同一产品身份下的配置差异进行参数化。 当改变同时引起整机外形、机箱兼容关系、主要计算功能、制造装配路线或成品SKU体系的根本变化时，应重新评估是否形成新的身份节点。
    - paragraph [ref=e935]: 配置覆盖应以实际交付数量或明确的研究情景权重汇总，并记录各配置在代表期内的份额，不能对未知市场组合任意设定平均值。 当配置覆盖不完整、需要建立家族代表模型时，只有BOM结构、净质量、制造地点和供应链具有可解释相似性的型号才可作为代理，并须披露未覆盖型号与差异方向。 代理失效条件包括主要部件数量跨档、共享接口代际改变、装配地迁移或净质量差异无法解释，触发后应停止外推并单列数据需求。
    - heading "节点特定采集字段" [level=3] [ref=e936]
    - paragraph [ref=e937]: 应采集型号级物料清单及各部件的净质量；同时，完整型号与SKU应作为采集主索引，并关联BOM版本、生效日期、配置代码、制造批次和单台净质量，防止跨版本拼接部件数据。 BOM条目至少应包含部件名称、内部料号、供应商料号、数量、计量单位、单件质量、材料或部件类别以及是否随产品交付；随机附件若随整机交付，应以独立BOM条目记录其质量，不得并入包装质量。 质量闭合应比较BOM汇总、产品称量和包装扣除后的结果，并为未闭合差额记录可能来自紧固件、线缆、散热材料或称量方法的原因。 若差额超过项目预先设定且记录在案的接受范围，应停止使用该BOM开展材料贡献分析，直至补充条目或完成重新称量。
    - paragraph [ref=e938]: 硬件采集字段用于复现具体配置，并识别刀片服务器本体与共享机箱之间的接口边界。 处理器字段应记录型号、数量、封装或模块料号和供应商，系统内存字段应记录总容量、条目数量、单条容量、类型及是否属于基础配置；板载存储配置应记录介质类型、数量、容量、是否可拆换和控制部件，网络接口配置则应记录板载与可插拔接口、端口数量和模块边界。 管理控制模块应说明是否独立成板、是否包含在主板PCBA以及对应质量；重复出现在主板与模块清单中的同一实体必须去重。 具体配置字段缺失时，可保留“未知”并建立上下界情景，不得依据产品家族宣传资料填入未确认的处理器、内存、存储或接口数量。
    - paragraph [ref=e939]: 供电接口与额定配置、冷却接口与方式应作为共享机箱连接字段采集，用于匹配使用模型，但不得把额定值直接当作实际能耗。 共享机箱只作为供电与冷却接口的连接对象记录，不纳入刀片服务器本体。
    - paragraph [ref=e940]: 制造记录应覆盖装配、测试、老化筛选、返工和报废等活动，并为各活动保存计量范围、能源或辅料单位、批量及活动版本。 良率应区分首次通过率、返工后合格率和最终报废率，并明确分母是投入件、装配台数还是测试次数，避免在多个环节重复放大损耗。
    - paragraph [ref=e941]: 包装字段只记录内包装、外箱和托盘等包装组成的材料、质量、装载数量、重复使用次数与运输交接点；交接点和装载数量共同确定进入运输模型的货量及起始边界，且包装汇总必须排除已列入BOM的随机附件。 运输记录应从该交接点关联起讫地、运输方式、距离依据、装载状态、批量和中转节点；只有运输方式而没有路径与货量时，不足以形成型号级前景运输。
    - paragraph [ref=e942]: 供应商采集应覆盖高贡献部件及关键替代来源，为每个料号记录供应商名称、生产地点、数据代表期、采购份额和是否采用代理数据；同时，双重或多重供应时，应按研究期采购份额建立供应商覆盖矩阵；份额未知时可设置等权或极端情景，但必须标为建模假设。 若供应商、生产地点或采购份额无法追溯，应降低供应链数据质量评级，且不得把家族级代理描述为完整型号的实测供应链。
    - paragraph [ref=e943]: 质量测量方法应说明秤具类型、分辨率、去皮步骤、样本量、抽样批次和异常值处理，使单台净质量具有可审计的测量边界。 测量记录应与产品型号、配置和抽样批次关联；缺少去皮步骤、样本范围或异常值处理时，称量结果不能用于证明型号级质量闭合。
    - paragraph [ref=e944]: 制造活动版本应验证BOM生效期、工艺路线、装配地、供应商组合和包装方案是否属于同一代表期。 发现跨期记录时应按版本拆分并单独说明；无法拆分的数据不得声明为完整型号级实测LCI。
    - heading "区域化补充要求" [level=3] [ref=e945]
    - paragraph [ref=e946]: 区域化建模应同时记录制造地点对应的电力供应区域，以及主要物料来源地、组装地和运输起讫地。 记录这些地点是为了把部件生产、最终装配、仓储和交付活动匹配到背景数据库的相应地理层级，不能以总部地址替代实际活动地。 在地点边界明确后，运输路径按来源地至装配地、装配地至区域仓库和仓库至交接点分段，并分别保存运输方式与距离依据。 厂址未知时使用与已知国家或区域粒度一致的运输和电力代理，并把厂址差异保留为地理不确定性，而不是伪造更精细位置。
    - paragraph [ref=e947]: 区域电力代理应按活动发生地点选择：最终装配与测试匹配装配地电力，高耗能部件制造则匹配相应供应商生产区域而非成品销售区域。 代理选择记录应包含背景数据名称、地理范围、技术范围、年份、替代理由和覆盖活动，确保后续能够识别同一电力数据被误用于不同供应链环节。 装配地或主要供应商区域变化时，应重配受影响活动的电力代理，并保留变更前后的地域依据。
    - paragraph [ref=e948]: 代表期应同时覆盖BOM、制造工艺、供应商份额、区域电力和运输网络，并说明数据年份与目标研究期之间的时间偏离。 技术代际会改变部件生产地域、供应商组合和运输网络，因此处理器平台、系统内存类型、接口代际或机箱兼容关系变化时，应同时复核相关区域化数据。 时间窗口变化时更新区域电力和运输网络，技术代际变化时更新受影响的部件配置与供应链代理；局部变化不使无关数据链一并失效。
