    - heading "数据适用状态与缺口" [level=3] [ref=e1332]
    - paragraph [ref=e1333]: 现有冻结事实只支持P003的成品身份、基本构成、刀片机箱依赖和A039图谱关系判定，不能据此宣称已取得任何具体型号的前景LCI。 长期缺失型号级物料清单、净质量、制造、运输、共享资源分配和代表性数据。 缺口登记应按完整型号与SKU拆分，分别标明所缺字段、责任数据源、目标代表期、拟用代理、预期影响方向和解除缺口的验收条件。 在型号级证据补齐前，节点可作为产品系统的结构接口和情景占位，但不能输出被解释为特定供应商、特定装配地或特定配置的确定结果。
    - paragraph [ref=e1334]: 不同型号的配置差异应作为前景数据适用性与不确定性来源处理；同时，配置不确定性应围绕处理器数量与类型、系统内存条目、存储、网络接口、管理模块和净质量建立情景，并保持每个情景内部BOM一致。 一致性检查应确认同一情景中的部件料号、数量、净质量和BOM版本来自同一型号；任一字段跨型号或跨版本即判为拼接失效。
    - paragraph [ref=e1335]: 共享资源的分配方法应单独记录并开展敏感性检验。 敏感性检验应比较按槽位、刀片服务器数量、运行时长、实测增量功率或其他可解释驱动量分配的结果，并披露空槽与冗余资源处理。 若不同分配方法改变主要结论或排序，应把共享机箱负荷标为关键不确定性，不能仅报告单一平均分配结果。
    - paragraph [ref=e1336]: 供应链代表性应分别从供应商覆盖、地理范围、时间窗口和技术代际四个维度评价。 供应商覆盖、地理范围、时间窗口和技术代际分别记录覆盖范围、偏差方向和代理依赖，不先合成为单一粒度等级。
    - paragraph [ref=e1337]: 数据适用等级分为缺失、家族级代理和型号级可追溯覆盖；最高等级要求记录能够对应具体型号、配置、数据来源和代表期，但不因此自动声称数据来自直接测量。 缺失、家族级代理和型号级可追溯覆盖只描述证据粒度；它与四维代表性评价并列报告，任何综合结论都必须披露两套结果及采用的保守规则。
    - paragraph [ref=e1338]: 代理可以临时填补同类部件或相近配置的数据空白，但必须记录映射对象、质量缩放方法、配置差异、区域差异和预计偏差方向。 代理失效条件包括BOM结构不相似、净质量无法闭合、主要供应商或装配地改变、制造路线不一致及跨越关键技术代际。 触发失效条件后，代理只可保留为边界探索，不得用于型号声明、精细比较或产品级公开比较，并应优先补采质量、制造、运输和供应链记录。
