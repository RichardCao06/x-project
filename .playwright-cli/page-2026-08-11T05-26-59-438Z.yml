  - generic [ref=e837]:
    - heading "定义与产品身份" [level=3] [ref=e838]
    - paragraph [ref=e839]:
      - text: 刀片服务器属于高密度服务器产品形态。
      - superscript [ref=e840]:
        - link "来源" [ref=e841] [cursor=pointer]:
          - /url: "#source-ku-b2ed767fd2c48333"
      - superscript [ref=e842]:
        - link "来源" [ref=e843] [cursor=pointer]:
          - /url: "#source-ku-bdce14693f667969"
      - text: 高密度只描述产品形态，不足以单独确认P003成品身份；本文将“刀片服务器”和“服务器刀片”视为同一称谓，并以完整装配状态和交接记录判定对象。 身份记录应至少关联完整型号、SKU、配置版本、序列批次和BOM版本，使同名产品的不同硬件组合能够被识别，同时避免把纯配置变化误判为新的产品层级。 若记录对象缺少成品型号、装配完成标识或可追溯交接凭证，则只能暂作部件集合或代理配置，不能据此确认其代表一台完成交付的P003产品。
    - paragraph [ref=e844]: 本节点以一台刀片服务器为建模对象，并将其与承载多台产品的刀片机箱、机架和数据中心基础设施区分。 P003只描述成品刀片服务器输出；机箱背板、电源、风扇、集中管理设备、机架结构和数据中心设施不进入产品本体，而通过相邻节点、使用阶段过程或明确分配规则处理。 层级判定应记录对象是否随单台产品交付、能否从机箱中单独拆换以及其质量是否已进入该台BOM，任一条件不清楚时都应保留边界待审状态。 若供应商资料把刀片服务器与刀片机箱作为整套系统报价，建模人员仍应依据实物清单和交接范围拆分，无法拆分的套装数据不得直接作为单台产品数据。
    - paragraph [ref=e845]: 同一产品家族内仅处理器数量、系统内存容量、存储配置或网络接口选件变化时，宜用配置参数和情景组合表达，并保持P003这一成品身份不变。 参数化记录应保存基础型号、选件代码、各选件净质量、适用BOM和代表期，以便计算特定配置时替换相应模块而不重复建立结构相同的节点。 当配置变化导致产品类别、主要计算功能、交付边界或制造路线发生实质改变，例如从CPU通用计算转为以加速器为主体时，参数化假设即达到失效条件。 型号之间若只有名称差异却无法取得配置映射，应暂列为证据缺口并执行保守情景，而不应凭名称相似性合并BOM、净质量或制造记录。
    - heading "性质与形态" [level=3] [ref=e846]
    - paragraph [ref=e847]:
      - text: 刀片服务器是一种高密度独立服务器设备，其基本构成至少包括处理器和系统内存。
      - superscript [ref=e848]:
        - link "来源" [ref=e849] [cursor=pointer]:
          - /url: "#source-ku-153eb8227d2556ca"
      - superscript [ref=e850]:
        - link "来源" [ref=e851] [cursor=pointer]:
          - /url: "#source-ku-73123c46ddb53634"
      - text: 这里的“独立”只表示刀片服务器能作为独立计算节点承担服务器功能，并不表示它可以脱离刀片机箱运行；“服务器刀片”只是同义简称。
    - paragraph [ref=e852]: 产品构成边界从完成装配并随交付移交的刀片服务器本体开始，覆盖板载电路以及随配置交付的计算、存储、网络和管理部件。 采集时应为每类部件记录料号、数量、单件质量、装配位置和是否随成品交付，并以这些字段检查BOM条目与单台净质量能否闭合。 无法确认存储器件、网络适配件或管理模块是否随产品交付时，应分别建立纳入与不纳入情景；不得依据产品家族资料反推具体部件数量。 物理接口应记录供电连接形式及额定配置、冷却接口与方式、背板或网络连接位置和管理通道，但这些接口记录本身不把机箱实体计入单台质量。
    - paragraph [ref=e853]: 产品清单应记录全部实体部件，并另设“是否可更换”属性；长期保留的外壳、板卡和连接结构与可替换的处理器、内存条、存储介质或接口模块都属于实体部件。 这种区分用于连接制造、维修替换和报废阶段，但初始随产品交付的可更换部件仍属于成品BOM，不能因为未来可能替换而从制造端删去。 部件记录应增加拆换单位、预期替换原因、替换后去向和序列追踪字段；缺少这些信息时，只能核算初始产品构成，不能推导维修期消耗。 若维修资料只给出备件套装质量而未区分实际换下部件，套装不得直接充当初始BOM，也不得假定每次维修消耗整套备件。
    - paragraph [ref=e854]: 包装与交付状态应区分裸机、含保护材料的销售包装、与多台产品共用的周转包装以及随机附件，并分别记录质量、数量基准和回收安排。 若包装清单不能映射到单台产品，或周转次数和返还率缺失，则包装负荷只能作为单独的不确定情景，不能以整批包装质量直接重复计入每台产品。
    - heading "参考流与交接边界" [level=3] [ref=e855]
    - paragraph [ref=e856]:
      - text: 刀片服务器是定义明确、能够独立发挥服务器功能的产品类别。
      - superscript [ref=e857]:
        - link "来源" [ref=e858] [cursor=pointer]:
          - /url: "#source-ku-4b940c265eae5d25"
      - superscript [ref=e859]:
        - link "来源" [ref=e860] [cursor=pointer]:
          - /url: "#source-ku-5f21a2b6e7e5d07f"
      - text: 本节点以一台完整刀片服务器作为产品交接单元。 参考流应表述为完成规定装配与制造检验、具备型号和配置标识并可交付的一台产品，不以板卡数量、计算能力或占用机箱槽位代替。 交接记录应关联单台净质量、BOM版本、配置清单、制造批次、包装状态和离开装配地的时间，从而确保物理产品与制造投入处于同一版本。
    - paragraph [ref=e861]: 制造端边界应包括形成该台产品所需的部件装配、测试、返工和厂内处置，并把可归属于产品的能源、辅料和损耗按一致活动版本汇总；同时，产品交接后所需的共享资源不并入该单台产品的固有物料构成。 使用期由刀片机箱提供的共享供电损耗、风扇冷却、背板通信和集中管理，应在使用模型中依据服务关系分配，而不是回填到出厂BOM。 制造测试期间临时使用的机箱或测试台若服务多个产品，应记录设备使用时长、测试批量和分配依据，并与交付后的共享基础设施明确分开。 若测试能耗同时包含机箱基载且无法识别产品增量负荷，应保留总量分配与增量估算两个情景，不能将全部机箱基载无条件归给被测单台产品。
    - paragraph [ref=e862]: 净质量应采用不含一次性包装的完成装配产品质量，并通过称量值、BOM质量汇总值和配置记录进行三方核对，差异应标记原因与处理方法。 BOM质量闭合应同时检查标配件、选配件、紧固件、散热材料和外壳等易遗漏项目，并明确电子数据中数量单位与质量单位的换算关系；单台称量、型号级BOM和配置快照属于同一代表期和制造批次，是三方数据能够比较并形成质量闭合的前提。
    - paragraph [ref=e863]: 称量包含运输托盘或一次性保护袋时，应记录并扣除这些边界外辅助物；只有装配在服务器本体内、构成该型号配置的部件计入单台净质量，独立随附的线缆、工具或备件即使列入交付清单也应作为单独交付物流记录。 若研究对象确需包含独立附件，应另行定义成套交付组合、列明产品本体与每类附件的独立质量，并保持该组合口径与“一台完整刀片服务器”的产品本体参考流相互区分。
    - heading "规格与相邻节点区分" [level=3] [ref=e864]
    - paragraph [ref=e865]:
      - text: 刀片服务器是一种设计用于刀片机箱的紧凑型模块化服务器。
      - superscript [ref=e866]:
        - link "来源" [ref=e867] [cursor=pointer]:
          - /url: "#source-ku-63ee063331febda0"
      - superscript [ref=e868]:
        - link "来源" [ref=e869] [cursor=pointer]:
          - /url: "#source-ku-90181e63c01a3961"
      - text: 本节点不吸收与刀片服务器配套使用的设备实体。 与刀片机箱的区分应依据实体所有权和质量边界：刀片服务器本身随单台交付，机箱外壳、共享电源、风扇和背板则服务多个槽位。 若销售资料只给出装满刀片的机箱总质量，应先取得空机箱、刀片服务器数量和各配置质量；不能完成拆分时，该数据仅适用于组合系统情景。
    - paragraph [ref=e870]: 与机架式服务器相比，P003的判定重点是产品需插入共享机箱接口，而不是以独立机架外壳、电源和完整冷却组件作为单台交付边界。 机架式服务器或完整刀片机箱即使与本产品共享部分部件，也不能仅凭用途相近套用同一成品BOM，除非逐项证明交付边界和配置等价。
    - paragraph [ref=e871]: 主板PCBA只是刀片服务器的组成部件；只有完成规定结构装配、配置集成和整机检验后，才形成P003成品。 成品SKU、装配范围和整机检验状态共同用于区分主板PCBA与P003成品。 来源中的“服务器模块”属于待识别称谓：只有装配范围和检验记录证明它代表完整成品时才映射到刀片服务器，否则按PCBA、管理模块或待识别组件处理。
    - paragraph [ref=e872]: 规格参数应按处理器、系统内存、存储、网络接口、管理控制模块、供电接口和冷却接口分组，并为每组保存型号、数量、容量或接口状态。 这些字段用于复现具体交付配置和匹配使用阶段接口，不据此把纯配置变化拆成新的产品节点。
    - heading "在系统中的角色" [level=3] [ref=e873]
    - paragraph [ref=e874]:
      - text: P003 在内部产品系统图中由 A039 产生。
      - superscript [ref=e875]:
        - link "图谱" [ref=e876] [cursor=pointer]:
          - /url: "#source-internal-graph"
      - text: P003是A039完成总装后交付给下游产品系统的通用计算刀片服务器流，用于把制造活动结果与具体产品配置、数量和净质量对应。 A039与P003接口以产品流标识、配置版本和制造批次作为识别键；合格产品数量和对应净质量作为输出量值，良率口径与包装交接状态作为关联属性。 若A039记录的是生产投料数量而P003记录的是合格出厂数量，二者之间必须由报废、返工和在制品变化调节，不能默认一比一闭合。
    - paragraph [ref=e877]: 上游部件过程应通过型号级BOM进入A039，包括处理器、系统内存、存储、网络接口、管理模块、结构件和其他随产品交付的实体。 每条上游接口应保存部件料号、供应商、来源地、数量单位、损耗归属和数据版本。 这些追溯字段使替代部件或双重采购能够按配置覆盖率表达。 若上游只有部件家族平均数据而缺少具体供应商和料号覆盖，应标示代理比例，不得把家族平均值描述为完整型号的实测供应链。
    - paragraph [ref=e878]: P003向下游产品系统提供的是制造完成的刀片服务器，不自动包含刀片机箱、机架、数据中心基础设施或使用期电力等后续服务。 下游模型调用时应同时传递产品配置、装配地、代表期和共享接口条件，否则同一节点结果可能被错误用于不匹配的机箱代际或供应链。
    - paragraph [ref=e879]: 共享制造资源位于刀片服务器产品实体之外；只有无法直接计量且确实服务多台产品时，才按制造批次、设备占用时间或资源驱动量分配其负荷。 分配结果是制造活动负荷，不是产品规格或相邻产品实体；能够直接归属单台产品的消耗不得参加平均分配。
    - paragraph [ref=e880]: 使用阶段的机箱供电和冷却属于刀片机箱提供的共享服务，不属于刀片服务器的固有物料构成。 在实体边界明确后，服务负荷可按槽位、产品数量、运行时长或实测增量分配；存在独占资源或直接计量时，平均分配即失效。
    - paragraph [ref=e881]: 使用阶段应接收单台产品及其配置参数，并另外连接运行电力、共享机箱负荷和数据中心服务；制造端产品节点不预设实际负载率或寿命。 负载率、寿命和共享服务需求属于使用情景参数，应与制造端产品输出分开保存并在下游模型中赋值。
    - paragraph [ref=e882]: 维修替换应把初始可更换部件、备件生产、运输、替换时间和退役去向分别建模，并避免将同一备件同时计入初始BOM与维修消耗。 只有使用情景给出部件寿命、替换频次和实际配置后，才能计算备件需求并与初始BOM执行防重复检查。
    - paragraph [ref=e883]: 报废阶段的归属应从P003净质量和生命周期内新增备件出发，按最终持有的材料与部件建立回收、再利用或处置接口。 若产品在报废前被整机再利用或拆出处理器、系统内存和存储继续使用，应保存转移数量和质量，避免原系统与后续系统重复承担或遗漏处置。 缺少维修频次、替换部件和寿命分布时，P003仍可用于制造端核算，但不得据此声称已经覆盖完整使用、维修和报废阶段。
    - heading "工艺图 · 邻域工序" [level=3] [ref=e884]
