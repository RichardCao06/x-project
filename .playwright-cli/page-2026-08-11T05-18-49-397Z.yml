    - heading "技术路线与相邻活动区分" [level=3] [ref=e879]
    - paragraph [ref=e880]: 回流SMT路线以焊膏印刷、贴装和受控回流焊形成焊点，区别于以通孔元件为主的波峰焊路线。 〔未核实·模型回忆〕
    - heading "节点特定采集字段" [level=3] [ref=e881]
    - paragraph [ref=e882]:
      - text: 应采集主板投产与良品数量、贴装元器件和焊接辅料投料、设备电力、返修报废量及排风处理配置。 〔未核实·模型回忆〕
      - superscript [ref=e883]:
        - link "方法说明" [ref=e884] [cursor=pointer]:
          - /url: "#source-internal-review"
    - heading "区域化补充要求" [level=3] [ref=e885]
    - paragraph [ref=e886]:
      - text: 应补充制造地点、电力供应区域、焊接排风治理水平和废物处置去向，以支持区域化背景连接。 〔未核实·模型回忆〕
      - superscript [ref=e887]:
        - link "方法说明" [ref=e888] [cursor=pointer]:
          - /url: "#source-internal-review"
