    - heading "单元过程边界" [level=3] [ref=e875]
    - paragraph [ref=e876]:
      - text: 单元过程边界覆盖元器件贴装、焊膏回流焊接及其现场工艺辅助投入，不延伸至上游元器件制造或下游整机装配。 〔未核实·模型回忆〕
      - superscript [ref=e877]:
