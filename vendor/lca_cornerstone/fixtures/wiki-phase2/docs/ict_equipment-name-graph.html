ower背景)——本厂SMT贴装线,前景;共生焊料浮渣由本活动产出。", "前景(独立显卡):显卡裸板、消费GPU、GDDR显存、VRM功率级、连接器、被动件、焊料与电力经A041贴装为显卡PCBA；再由A042安装TIM、铝散热器、铜热管或均热板、风扇、导流罩和I/O结构件形成装配完成整卡；A043完成VBIOS/固件、显存、接口与高负载热稳定性测试；A044终检、贴标并包装为可销售SKU。品牌、具体GPU型号、显存容量、板卡功耗和槽位厚度均作数据集attributes，不另造身份节点。", "前景:活动『系统集成, 机箱集成 | 网络交换机, networking_800g, 2u』产出 800G 交换机整机(system),CONSUMES 交换主板PCBA(本行业前景)/交换ASIC封装(electronics背景,Tomahawk/Spectrum类)/光模块800G(electronics背景)/PSU模组(本行业前景)/钢钣金机箱(steel背景)/铝散热器(aluminium背景)/风扇(electronics背景)/电力(power背景)——本厂交换机集成线,前景;其老化在 burn_in_test 活动。", "前景:活动『烧录测试, 压力老化 | 测试合格整机』产出测试合格整机(system),CONSUMES 待测整机(本行业前景system)+电力(power背景,老化柜长时高功率运行)——本厂烧录老化间,前景;产出测试合格整机与共生不良整机(报废返修)。", "前景:活动『配置出厂, 机架级集成 | 机架系统, rack_system』产出机架系统(system),CONSUMES 服务器整机×N(本行业前景system)/交换机(本行业前景system)/UPS或PDU(本行业前景system或electronics背景)/机架机柜钢框(steel背景)/铜母排与电缆(copper/plastics背景)/电力(power背景,集成测试)——本厂机架集成与配置工位,前景。", "背景(电力,已建 linked):SMT回流焊/老化测试柜/整机烧机/机架集成外购电力——boundary=background,home_industry=power,home_status=linked,resolves_to=power::electricity.medium_voltage.market_group.na_electricity(电已建,linked;SMT与老化测试耗电是 ICT 制造能耗主项)。", "背景(电子,已建 linked):CPU/GPU/交换ASIC封装IC、DRAM/NAND内存Die、PCB裸板、被动元件、连接器、光模块、外购成品板卡/电源模块——boundary=background,home_industry=electronics,home_status=linked,resolves_to=electronics 对应封装器件/裸板/PCBA前景节点(电子已建,linked;ICT核心价值器件全部外购自电子)。", "背景(铝,已建 linked):机架铝框/铝散热器/铝机箱/铝挤型导风结构——boundary=background,home_industry=aluminium,home_status=linked,resolves_to=aluminium 铝型材/铸件节点(铝已建,linked)。", "背景(钢,占位):机架机柜钢框/钣金机箱/导轨/紧固件——boundary=background,home_industry=steel,home_status=placeholder(钢行业已建但此处按代表性钣金件诚实占位待解析,计入覆盖率)。", "背景(铜,占位):散热铜热管/均热板/铜底板、电源母排铜排、电缆线束铜导体——boundary=background,home_industry=copper,home_status=placeholder(铜行业未建,诚实占位,计入覆盖率);线缆塑料护套 home_industry=plastics,placeholder;焊料锡膏/无铅焊料 home_industry=nonferrous_metals,placeholder;导热硅脂/导热垫 home_industry=chemicals,placeholder。", "前景共生(边界内):SMT焊料浮渣(solder dross)、报废/不良PCBA(scrap PCBA)、测试不良整机(failed/rework unit)、贵金属回收料(从报废板卡回收金钯)、包装废料(packaging waste)由本行业活动产出,须列全共生产品(不变量 B),为前景产品节点(byproduct;贵金属回收料标 home_industry=electronics 的内部回流或作回收链输入)。"]}, "product_facets": [{"name": "equipment_class", "description": "设备类——ICT 作为纯装配/集成型产品的最粗一层身份轴,区分节点是整机端(服务器/交换机/存储/UPS/机架)、板级子总成端(主板PCBA/GPU加速卡/内存条/SSD模组/PSU模组)还是共生副产物。它决定该节点处于嵌套装配图的哪一层、由哪类装配活动产出、在引用嵌套图中作消费端(整机CONSUMES子总成)还是产出端。这是 ICT 区别于电子(含材料/器件工艺)的核心刻面:ICT 只装配不转化材料,故主轴是『装配出来的是哪一类设备/子总成』。语义与电子 component_class、机械 equipment_class 同构,但聚焦整机+板级总装层(下层芯片/裸板属 electronics 背景)。", "controlled_values": ["server(服务器整机:通用服务器/GPU计算服务器/推理服务器,system层)", "switch(网络交换机整机:ToR/Leaf/Spine/InfiniBand交换机,system层)", "storage(存储设备整机:全闪存阵列/混合存储/JBOD/JBOF,system层)", "ups(不间断电源/电源分配整机:UPS/PDU,system层)", "rack_enclosure(机架系统/机柜:整柜集成的机架系统,system层)", "compute_card(计算/加速板卡子总成:主板PCBA/GPU加速卡/网卡/RAID卡等贴装后板卡,subsystem层)", "memory_module(内存模组子总成:DIMM内存条/内存扩展板,subsystem层)", "storage_module(存储模组子总成:SSD模组/NVMe盘/存储背板,subsystem层)", "psu_module(电源模组子总成:服务器PSU电源模块/电源背板,subsystem层)", "byproduct(共生副产物:焊料浮渣/报废PCBA/不良整机/贵金属回收料/包装废料)"], "rationale": "只分到『改变节点在嵌套图中的角色与装配活动类型』的层:server/switch/storage/ups/rack_enclosure 是整机(system),由 system_assembly/configuration 产出且互为顶层交付件;compute_card/memory_module/storage_module/psu_module 是板级子总成(subsystem),由 smt_assembly/system_assembly 的子总成装配产出、被整机 CONSUMES(整机CONSUMES主板PCBA+GPU加速卡+DIMM+SSD模组+PSU模组),故必须分。整机五类分立因:服务器(计算)/交换机(网络)/存储(数据)/UPS(供电)/机架(集成容器)的装配拓扑、消耗子总成清单、集成测试方式结构性不同(GPU服务器装8块加速卡+液冷、交换机装ASIC+光模块、存储装大量SSD背板),改变 LCI 与系统边界,是合法拆分。byproduct 单列以满足不变量 B『产出列全』(SMT焊料浮渣/报废PCBA/贵金属回收料须显式建节点)。**按设备类/子总成类截断,不枚举每个品牌型号**——同类设备的型号/世代差异(不同厂商2U服务器、不同代CPU)由 compute_type+form_factor+attributes 承载,不在此爆炸。芯片/裸板不在此(属 electronics 背景),ICT 主轴止于整机+板级总装层。这是 ICT 纯装配身份的最粗主轴。"}, {"name": "integration_level", "description": "集成层级——ICT 装配树的纵向坐标,与 equipment_class 协同标注节点在『component(外购件/分立元件)→ subsystem(板级子总成)→ system(整机/机架系统)』集成链上的高度。它决定该节点由哪个装配活动产出、被哪个上级层级 CONSUMES,是引用嵌套(rack_system→server→主板PCBA+GPU加速卡+DIMM+SSD模组+PSU模组→[electronics背景:封装IC+PCB裸板+被动元件])的实现锚。这是任务要求的四条核心身份轴之一(server/switch=system、PCBA/加速卡/DIMM/SSD/PSU=subsystem)。", "controlled_values": ["system(系统层:整机或机架系统,交付的最终件;server/switch/storage/ups/rack_enclosure,由 system_assembly/configuration 产出)", "subsystem(子总成层:板级子总成,由本行业SMT/总装活动产出并被整机CONSUMES;主板PCBA/GPU加速卡/DIMM/SSD模组/PSU模组,由 smt_assembly/system_assembly 产出)", "component(部件层:本行业不再拆分的外购成品件或内制分立件,通常作背景或横切件;成品板卡/成品电源等整件外购时取此)", "na(横切件/副产物:不在主集成纵轴上的件,如共生废料/回收料/包装)"], "rationale": "集成层级是装配嵌套的纵向身份轴(任务要求四条核心身份轴之一,与 equipment_class、compute_type、form_factor 并列)。system/subsystem/component 各对应不同装配活动产出高度且严格 CONSUMES 下层(system CONSUMES subsystem、subsystem CONSUMES component[多为electronics背景的封装IC+PCB裸板+被动元件]),这正是『集成层级靠引用嵌套不物理包含』的实现,故必须分。粒度止于『有独立装配活动产出、上级单独 link』的层,不在相邻层间再设无意义中间层。component 给本行业不再展开的外购成品件(成品板卡/成品风扇/成品电源整件外购时)或并入背景的分立件——它们供给上级但本行业不对其做装配增值,故多标 boundary=background 经 GPID 解析。na 给副产物/回收料/包装等不在主纵轴上的横切件。注意:integration_level 与 equipment_class 部分语义重叠但视角不同(equipment_class=节点是哪类设备/子总成、integration_level=在纵轴第几层),两者联合保证键唯一(如 server×system vs compute_card×subsystem 不碰撞;同一 server 在不同 form_factor 下仍 system 层,靠 form_factor 再分)。"}, {"name": "compute_type", "description": "计算/功能类型——ICT 的第三条核心身份分叉,标注整机或板级子总成所承载的核心计算/网络/存储/供电功能类型。它结构性决定该节点消耗哪类核心器件(GPU训练服务器消耗高端GPU+HBM+NVLink+液冷;800G交换机消耗高端交换ASIC+800G光模块;全闪存存储消耗大量NAND SSD),从而改变装配拓扑、子总成清单与系统边界,是 ICT-LCA 区分的关键驱动(AI数据中心训练/推理服务器与通用CPU服务器器件构成与价值结构截然不同)。仅在功能相关节点进键;与功能无关的通用横切件取 na。", "controlled_values": ["cpu_compute(通用CPU计算:通用服务器/通用主板,以CPU为核心算力)", "gpu_ai_training(GPU AI训练:HGX/MGX类训练服务器与GPU加速卡,高端GPU+HBM+高速互连NVLink/IB+液冷)", "gpu_ai_inference(GPU AI推理:推理服务器与推理加速卡,推理GPU/ASIC+风冷为主)", "gpu_graphics_consumer(消费级独立图形板卡:PCIe独立显卡,消费GPU+GDDR显存+板载供电+风冷散热,与AI训练/推理加速卡互斥)", "networking_100g_400g(100G/400G网络:ToR/Leaf交换机与网卡,100G/400G端口,含IB NDR 400G)", "networking_800g(800G及以上网络:Spine/高端交换机,800G端口,新一代AI网络互连)", "storage_flash(闪存存储:全闪存阵列/NVMe SSD模组,以NAND闪存为介质)", "storage_hdd(机械存储:HDD存储阵列/JBOD,以机械硬盘为介质)", "power_conditioning(电源调节/供电:UPS/PDU/PSU模组,供电与电能质量调节功能)", "na(与计算/网络/存储/供电功能无关的通用件:机架机柜/通用副产物/包装等)"], "rationale": "计算/功能类型是 ICT-LCA 区分的主驱动(生产/产品功能定位是头号影响驱动因素,直接决定核心器件构成)。gpu_ai_training vs gpu_ai_inference vs cpu_compute 分立因:训练服务器(HGX/MGX,8×高端GPU+HBM+NVLink/InfiniBand+液冷)、推理服务器(中端GPU/ASIC+风冷)、通用CPU服务器三者消耗的核心器件、互连、散热与电源结构性完全不同,改变上游electronics背景器件与系统边界,是合法拆分(任务明确AI数据中心训练/推理重点)。networking_100g_400g vs networking_800g 分立因:端口速率代际跃迁改变交换ASIC等级、光模块功率密度与散热(800G是新一代AI网络主干),LCI显著不同。storage_flash vs storage_hdd 分立因:介质从NAND闪存到机械硬盘完全异构,改变核心物料(electronics SSD vs 机电HDD)。power_conditioning 单列承接UPS/PSU供电类功能。**具体CPU世代/GPU型号/内存容量/端口数=性能参数,不进身份**(同一 gpu_ai_training 身份不同GPU代际只是数值/代际投影,作 attributes 下沉;任务明确这些是派生配置属性)。na 给跨功能复用的通用件(机架机柜可容纳任意功能设备)以允许复用同一节点,避免按功能爆炸。"}, {"name": "form_factor", "description": "机箱形态——ICT 整机/子总成的物理外形规格轴,标注节点的机箱高度/外形类别(1U/2U/4U标准机架高度、blade刀片、rack_system整柜)。它结构性影响机箱钣金/散热设计/功率密度/装配工位(4U GPU服务器机箱用料与散热远大于1U、刀片共享背板与电源、整柜含机柜框与配电),改变机箱与散热背景投入及总装拓扑,是合法的命名与身份区分轴。仅在机箱承载件(整机)进键;板级子总成(PCBA/DIMM/SSD/PSU模组本身)与副产物取 na(其外形由所属整机决定)。", "controlled_values": ["1u(1U机架式:单U高度机架服务器/交换机,高密度薄型)", "2u(2U机架式:双U高度机架服务器/交换机/存储,主流通用形态)", "4u(4U机架式:四U高度,常用于GPU训练服务器/大容量存储,高散热高扩展)", "blade(刀片式:刀片服务器/刀片交换机,共享刀箱背板与电源)", "rack_system(整机架系统:42U/48U机柜整柜集成的机架系统)", "na(无独立机箱形态的件:板级子总成PCBA/DIMM/SSD模组/PSU模组本身、副产物、整件外购的component)"], "rationale": "机箱形态是 ICT 整机身份的物理区分轴(任务要求四条核心身份轴之一)。1u vs 2u vs 4u vs blade vs rack_system 分立因:机箱高度/外形结构性改变钣金机箱用料(steel/aluminium背景量)、散热设计(1U高速小风扇 vs 4U大散热器/液冷 vs blade共享散热)、功率密度与装配工位,直接改变机箱与散热背景投入及system_assembly拓扑,是合法拆分(支撑任务的1U/2U/4U/blade/rack_system枚举与GPU训练4U重点)。**机箱尺寸的连续数值(深度mm/重量kg)、端口密度=非身份属性**,作 attributes 下沉;form_factor 只取结构性外形类别,不下到具体尺寸数值。na 给板级子总成(其本身无独立机箱,外形由所属整机承载)、副产物与整件外购component,使这些节点不被强塞机箱坐标、可跨整机复用(同一 GPU加速卡subsystem 可装入2U或4U整机)。注意:form_factor 与 equipment_class+compute_type 联合保证键唯一(server×system×gpu_ai_training×4u vs server×system×gpu_ai_training×2u 是两个合法不同节点,因机箱用料与散热结构性不同)。"}, {"name": "product_subtype", "description": "product_subtype(对账升格:数据已用作产品身份区分)", "controlled_values": ["accelerator", "backplane", "controller_board", "graphics_card_assembled", "graphics_card_packaged", "graphics_card_pcba", "graphics_card_tested", "gpu_package", "gddr_memory", "graphics_card_bare_pcb", "graphics_card_fan", "graphics_card_heatsink", "graphics_card_bracket", "graphics_card_shroud", "graphics_card_power_stage", "graphics_card_connector_set", "mainboard", "switch_mainboard", "GPU推理服务器, 2u, gpu_ai_inference", "GPU计算服务器, 4u, gpu_ai_training", "PSU电源模组, power_conditioning", "SSD模组, storage_flash", "UPS不间断电源, 2u, power_conditioning", "共生包装废料", "共生报废PCBA", "共生测试不良整机", "共生焊料浮渣", "共生贵金属回收料", "内存条DIMM", "刀片服务器, blade, cpu_compute", "存储阵列, 2u, storage_flash", "存储阵列, 2u, storage_hdd", "存储阵列, 4u, storage_flash", "存储阵列, 4u, storage_hdd", "机架PDU, 1u, power_conditioning", "机架系统, rack_system", "测试合格整机", "笔记本电脑, cpu_compute", "网络交换机, 1u, networking_100g_400g", "网络交换机, 2u, networking_100g_400g", "网络交换机, 2u, networking_800g", "通用服务器, 1u, cpu_compute", "通用服务器, 2u, cpu_compute"], "rationale": "升格表外刻面以恢复键唯一。"}], "activity_facets": [{"name": "transformation_verb", "description": "装配/集成动词——活动所执行的核心 ICT 装配、集成、测试或市场动作,是活动身份的主轴。ICT 是**纯装配/集成型**行业,动词均为装配动作(贴装/总装/测试/配置)而非材料转化,与参考产品配对构成单元过程(活动=动词,参考产品=名词锚)。market_for 为背景市场聚合占位动词(给外购整件的市场活动,与 boundary=background 配套)。", "controlled_values": ["smt_assembly(SMT贴装:锡膏印刷·贴片·回流焊,把封装IC/被动元件/连接器贴装到PCB裸板上,产出主板PCBA/加速卡等板级子总成)", "system_assembly(系统集成/整机总装:把主板+板卡+内存+存储+电源+散热+机箱集成为整机,或把子总成成组,产出整机系统与板级子总成)", "burn_in_test(烧录测试/老化:BIOS固件烧录·上电自检POST·压力老化·良率筛选,产出测试合格件)", "configuration(配置出厂/机架集成:机型配置·机架级整柜集成·终检·包装,产出配置完成的整机/机架系统)", "market_for(市场聚合:为外购成品整件[成品板卡/成品电源/成品风扇等]提供市场活动占位,boundary=background,不展开上游)"], "rationale": "动词锚在『有意义且数据可分离的装配/集成动作』(单元过程=被量化输入输出的最小有意义转化)。任务要求的 ICT 前景装配活动(SMT贴装/系统集成/烧录测试/配置出厂)在此一一展开为可分离动词:smt_assembly 承接板级贴装(主板PCBA/GPU加速卡/各类板卡的回流焊贴装);system_assembly 承接整机总装与子总成成组(整机集成机箱/散热/互连);burn_in_test 单列正因烧录老化是独立耗电与良率筛选环节(老化柜长时高功率运行,耗电与时间显著,需单独挂能耗与良率背景);configuration 单列正因机型配置与机架级整柜集成是 ICT(尤其数据中心)特有的、改变交付形态与系统边界的独立环节(整柜集成消耗多台整机+机柜+配电)。market_for 为背景外购整件提供市场动词以与跨行业规约配套(成品板卡/电源整件外购时标background+market_for)。不把同一动作的设备变体升为不同动词(高速贴片机 vs 多功能贴片机同为 smt_assembly),设备/工艺差异由 technology_route 承载。"}, {"name": "technology_route", "description": "技术路线——实现该装配/集成动词的具体工艺路线或集成方式。区分同一动词下生产系统显著不同(从而 LCI 不同)的活动。覆盖贴装方式(回流SMT)、整机集成(机箱集成/线缆管理)、配置(BIOS配置)、测试(压力测试/终检)等命名需要。", "controlled_values": ["reflow_smt(回流焊SMT贴装产线:锡膏印刷+贴片+回流焊,板级器件贴装主路线)", "chassis_integration(机箱集成产线:整机机械总装,把子总成+散热+电源装入机箱并互连)", "cooler_integration(板卡散热与结构装配:安装散热器/热管或均热板/风扇/导流罩/I/O挡板与背板,形成可测试整卡)", "cable_management(线缆管理/互连集成:整机内/机架内电源线·信号线·液冷管路布线与连接)", "bios_config(BIOS/固件配置:固件烧录·BIOS参数配置·机型软件配置)", "stress_test(压力老化测试产线:上电自检·高温高负载老化·良率筛选)", "firmware_functional_test(板卡固件与功能测试:VBIOS/固件烧录·接口与显存测试·高负载老化·良率筛选)", "final_qc(终检与出厂产线:整机/机架终检·包装·出厂)", "na_route(路线无关的通用活动:如背景market_for聚合或路线无关装配占位)", "rack_integration(机架级集成:服务器、交换机、存储与供配电设备的整柜装配和互连)", "final_packaging(终检与包装:产品终检、标签、附件配套、缓冲与销售包装)"], "rationale": "技术路线是 LCA 区分的主驱动(生产/技术路线是头号影响驱动因素)。贴装路线 reflow_smt 锚板级回流焊贴装(ICT板级子总成主路线)。整机集成路线 chassis_integration vs cable_management 分立因:机械机箱集成(装板卡/散热/电源)与线缆/液冷互连管理是可分离的整机装配工序且LCI不同(GPU训练服务器液冷管路与高密度互连显著)。配置路线 bios_config 锚固件/机型配置(无重物料消耗但有独立工时与测试能耗)。测试路线 stress_test 锚压力老化(老化柜高功率长时耗电是主能耗项)。出厂路线 final_qc 锚终检包装(消耗包装背景)。粒度止于『产线/集成方式改变 LCI 或交付形态』,不下到具体设备厂商或具体测试时长(某品牌贴片机、某型号老化柜、某小时数),厂商/设备/时长作 attributes/性能参数。na_route 给路线无关通用活动占位(背景market_for或路线无关装配)。"}, {"name": "reference_product_anchor", "description": "所锚定的参考产品——该活动的指定参考产出(输出端口),下游靠它 link 回来,使活动成为图中可连节点。值为某 Product 节点的规范键引用(非自由文本,ref:: 前缀)。", "controlled_values": ["ref::server(服务器整机,具体计算类型/形态由 compute_type/form_factor 携带)", "ref::switch(网络交换机整机,速率由 compute_type 携带)", "ref::storage(存储设备整机,介质由 compute_type 携带)", "ref::ups(UPS/PDU供电整机)", "ref::rack_enclosure(机架系统/机柜,configuration整柜集成锚)", "ref::compute_card(计算/加速板卡子总成:主板PCBA/GPU加速卡/网卡,smt_assembly/system_assembly锚)", "ref::memory_module(内存模组子总成:DIMM内存条)", "ref::storage_module(存储模组子总成:SSD模组/NVMe盘)", "ref::psu_module(电源模组子总成:服务器PSU电源模块)", "ref::tested_unit(服务器/交换机/存储设备, 测试合格/子总成,burn_in_test锚)", "ref::recovered_material(贵金属/金属回收料,共生/回收输出,不单独建测试活动)", "ref::solder_dross(SMT焊料浮渣,仅作共生不单独锚)", "ref::scrap_pcba(报废/不良PCBA,仅作共生不单独锚)", "ref::failed_uni /* ===== 节点 Wiki 抽屉：点击卡片 → 内嵌 wiki.html 动态渲染 ===== */
(function(){
  const css=`.wiki-card{position:relative;cursor:pointer}
.wiki-card::after{content:"📖 wiki ›";position:absolute;top:11px;right:13px;font:600 10px/1 "SF Mono",monospace;color:var(--cyan2);opacity:.5}
.wiki-card:hover::after{opacity:1}
.wiki-card:hover{border-color:var(--cyan)!important}
.wiki-card details,.wiki-card summary,.wiki-card a{cursor:auto}
#wkov{position:fixed;inset:0;background:rgba(4,9,18,.62);backdrop-filter:blur(2px);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s}
#wkov.show{opacity:1;pointer-events:auto}
#wkdr{position:fixed;top:0;right:0;height:100%;width:min(880px,95vw);background:var(--bg);border-left:1px solid var(--cyan2);z-index:91;transform:translateX(101%);transition:transform .22s ease;box-shadow:-22px 0 60px rgba(0,0,0,.55);display:flex;flex-direction:column}
#wkdr.show{transform:none}
#wkbar{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
#wkbar .t{flex:1;font:12px "SF Mono",monospace;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wkbar a,#wkbar button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 11px;font:12px inherit;cursor:pointer;text-decoration:none}
#wkbar a:hover,#wkbar button:hover{border-color:var(--cyan2)}
#wkif{flex:1;border:0;width:100%;background:var(--bg)}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div id="wkov"></div><aside id="wkdr" aria-hidden="true">
    <div id="wkbar"><span class="t" id="wkt">节点 Wiki</span>
      <a id="wkfull" target="_blank" rel="noopener">↗ 整页</a>
      <button id="wkx">✕ 关闭</button></div>
    <iframe id="wkif" title="node wiki"></iframe></aside>`;
  document.body.appendChild(wrap);
  const ov=document.getElementById('wkov'),dr=document.getElementById('wkdr'),
        ifr=document.getElementById('wkif'),t=document.getElementById('wkt'),full=document.getElementById('wkfull');
  const wikiViewer='ict_equipment-wiki.html',wikiPreviewViewer='ict_equipment-wiki-preview.html',
        wikiPreviewIds=new Set([]);
  const viewerFor=id=>wikiPreviewIds.has(id)?wikiPreviewViewer:wikiViewer;
  function open(id){
    const viewer=viewerFor(id),isDraft=wikiPreviewIds.has(id);
    ifr.src=viewer+'?id='+encodeURIComponent(id)+'&embed=1';
    full.href=viewer+'?id='+encodeURIComponent(id);
    t.textContent=id+(isDraft?' · DRAFT PREVIEW（未发布）':' · 节点 Wiki');
    ov.classList.add('show');dr.classList.add('show');dr.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }
  function close(){ov.classList.remove('show');dr.classList.remove('show');dr.setAttribute('aria-hidden','true');
    document.body.style.overflow='';setTimeout(()=>{if(!dr.classList.contains('show'))ifr.src='about:blank';},240);}
  document.addEventListener('click',e=>{
    const c=e.target.closest('.wiki-card');if(!c)return;
    if(e.target.closest('details')||e.target.closest('summary')||e.target.closest('a'))return;
    const id=c.getAttribute('data-id');if(id)open(id);
  });
  document.getElementById('wkx').onclick=close;ov.onclick=close;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  window.addEventListener('message',e=>{if(e.data&&e.data.wikiNav){const id=e.data.wikiNav;
    const isDraft=wikiPreviewIds.has(id),viewer=viewerFor(id),
          desired=viewer+'?id='+encodeURIComponent(id)+'&embed=1';
    // 子页会先在当前 bundle 内导航；父页必须重新执行 allowlist 路由，
    // 否则从一个 preview 节点可继续浏览整个 preview bundle。
    if(ifr.getAttribute('src')!==desired)ifr.src=desired;
    full.href=viewer+'?id='+encodeURIComponent(id);
    t.textContent=id+(isDraft?' · DRAFT PREVIEW（未发布）':' · 节点 Wiki');}});
  // 深链：打开页面时带 #wiki=A005 直接弹出
  const h=location.hash.match(/wiki=([PA]\d{3})/);if(h)setTimeout(()=>open(h[1]),300);
})();
