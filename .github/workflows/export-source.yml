name: export-source

on:
  push:
    branches:
      - agent/v2-complete
  pull_request:
    branches:
      - agent/goal-contract-governance-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: |
          tar --exclude=.git --exclude=var --exclude='*.pyc' --exclude=__pycache__ -czf /tmp/x-project-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: x-project-source
          path: /tmp/x-project-source.tgz
          if-no-files-found: error
          retention-days: 1
